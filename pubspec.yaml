name: subconscious_workspace
description: Open-source multi-platform Subconscious workspace.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.13.2 <4.0.0'

workspace:
  - apps/core_business_logic
  - apps/shared_ui_kit
  - apps/unified_app
  - apps/tui_app

dev_dependencies:
  lints: 6.1.0

# AGP 9 rejects 'proguard-android.txt' used by flutter_inappwebview_android 1.1.3.
# Patched local copy uses 'proguard-android-optimize.txt'. Remove once upstream releases a fix.
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
