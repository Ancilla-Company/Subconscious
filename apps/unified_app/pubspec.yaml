name: unified_app
description: Adaptive Subconscious Flutter application.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  core_business_logic:
    path: ../core_business_logic
  flutter:
    sdk: flutter
  flutter_code_editor: 0.3.5
  flutter_highlight: 0.7.0
  flutter_inappwebview: 6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  flutter_webrtc: 1.6.2+hotfix.4
  fluentui_system_icons: 1.1.273
  http: 1.6.0
  highlight: 0.7.0
  markdown: 7.3.1
  shared_ui_kit:
    path: ../shared_ui_kit
  url_launcher: 6.3.2
  window_manager: 0.5.2
  file_selector: 1.1.0
  record: 7.1.2
  audioplayers: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/document_preview/
    - assets/document_preview/licenses/
    - windows/runner/resources/app_icon.ico
    - windows/runner/resources/icon_title.svg
