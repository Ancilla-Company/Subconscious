<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subconscious</title><link rel="stylesheet" href="popup.css"></head><body><main class="app"><aside class="rail" aria-label="Primary navigation"><div class="brand" aria-label="Subconscious">S</div><button type="button" class="nav selected" data-view="workspaces" aria-label="Workspaces" title="Workspaces">▦</button><button type="button" class="nav" data-view="threads" aria-label="Threads" title="Threads">☷</button><button type="button" class="nav" data-view="files" aria-label="Files" title="Files">▤</button><div class="spacer"></div><button type="button" class="nav" data-view="settings" aria-label="Settings" title="Settings">⚙</button></aside><section class="content"><header><strong>Subconscious</strong><span id="status" role="status">disconnected</span></header><section id="workspaces" class="view"><h1>Workspaces</h1><div id="workspace-list" class="list"></div><form id="workspace-form"><input id="workspace-name" aria-label="Workspace name" placeholder="New workspace" required><button type="submit">Create workspace</button></form></section><section id="threads" class="view hidden"><h1>Threads</h1><p id="thread-hint" class="hint">Choose a workspace first.</p><div id="thread-list" class="list"></div><form id="thread-form" class="hidden"><input id="thread-title" aria-label="Thread title" placeholder="New thread title"><button type="submit">Create thread</button></form><section id="chat" class="hidden"><div id="messages" class="messages" aria-live="polite"></div><form id="chat-form"><textarea id="chat-input" aria-label="Message" placeholder="Message Subconscious" required></textarea><button type="submit">Send</button></form></section></section><section id="files" class="view hidden"><h1>Files</h1><p id="file-hint" class="hint">Choose a workspace first.</p><select id="file-root" class="hidden" aria-label="Workspace folder"></select><div id="file-list" class="list"></div></section><section id="settings" class="view hidden"><h1>Engine connection</h1><form id="connection-form"><label>Engine URL<input id="engine-url" required placeholder="http://localhost:55681"></label><label>Joining token<input id="engine-token" required type="password"></label><button type="submit">Connect</button></form><button type="button" id="disconnect" class="secondary">Disconnect</button><p class="hint">Credentials remain in Chromium extension storage. Host access is requested only for this engine origin.</p></section></section></main><script src="popup.js"></script></body></html>
