[pytest]
testpaths = tests
pythonpath = engine/src
asyncio_default_fixture_loop_scope = function
markers =
    lan: verifies reachability through a real non-loopback local network interface
    live: end-to-end tests with the real subconscious-server and real engines; collected always, skipped unless SC_LIVE=1, a path under tests/live or -m live is given (tests/live/README.md)
